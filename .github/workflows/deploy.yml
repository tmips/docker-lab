name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  lint:
    name: Run Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install HTMLHint
        run: npm install -g htmlhint

      - name: Lint HTML
        run: htmlhint index.html

      - name: Install stylelint
        run: |
          npm install -g stylelint stylelint-config-standard stylelint-config-recommended
          echo '{ "extends": "stylelint-config-standard" }' > .stylelintrc.json

      - name: Lint CSS
        run: stylelint styles.css

      - name: Install Hadolint (Dockerfile linter)
        run: |
          wget -O /bin/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /bin/hadolint

      - name: Lint Dockerfile
        run: hadolint Dockerfile

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/lab4:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/lab4:latest
